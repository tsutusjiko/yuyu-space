<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊ゆうスペース - 職員管理メニュー</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 20px; background-color: #eceff1; color: #37474f; }
    .container { max-width: 850px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .view-screen { display: none; }
    .view-screen.active { display: block; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #cfd8dc; padding-bottom: 12px; margin-bottom: 20px; }
    h1 { font-size: 22px; margin: 0; color: #263238; }
    
    .menu-grid { display: flex; flex-direction: column; gap: 15px; }
    .menu-card { display: flex; align-items: center; padding: 20px; background: #fafafa; border: 2px solid #cfd8dc; border-radius: 10px; cursor: pointer; text-decoration: none; color: #37474f; transition: 0.2s; }
    .menu-card:hover { background: #e3f2fd; border-color: #2196f3; }
    .menu-icon { font-size: 36px; margin-right: 20px; width: 45px; text-align: center; }
    .menu-info h3 { margin: 0 0 5px 0; font-size: 18px; color: #1976d2; }
    .menu-info p { margin: 0; font-size: 13px; color: #546e7a; }

    .btn { padding: 10px 18px; font-size: 14px; font-weight: bold; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .btn-back { background-color: #718096; }
    .btn-blue { background-color: #3182ce; }
    .btn-green { background-color: #38a169; }
    .btn-clear { background-color: #95a5a6; }

    /* フォーム要素 */
    .form-group { display: flex; flex-direction: column; margin-bottom: 12px; }
    .form-group label { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #4a5568; }
    .form-group input, .form-group select { padding: 9px 12px; font-size: 15px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .section-title { font-size: 15px; font-weight: bold; color: #2b6cb0; border-bottom: 2px solid #bee3f8; padding-bottom: 5px; margin: 20px 0 12px 0; }

    /* 和暦・西暦セレクタ */
    .bday-type-selector { display: flex; gap: 15px; margin-bottom: 6px; font-size: 13px; }
    .wareki-container { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .wareki-select { width: 90px !important; }
    .wareki-input { width: 55px !important; text-align: center; }
    .date-preview { font-size: 12px; color: #3182ce; font-weight: bold; margin-top: 4px; }

    /* 表スタイル */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { background-color: #34495e; color: white; padding: 10px; text-align: left; }
    td { padding: 10px; border-bottom: 1px solid #cfd8dc; }

    /* カード・印刷スタイル */
    .biz-card { width: 340px; height: 205px; margin: 10px auto; border: 1.5px solid #2b6cb0; border-radius: 8px; background: #f0f7ff; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
    .card-header { display: flex; justify-content: space-between; border-bottom: 2px solid #3182ce; font-size: 13px; font-weight: bold; }
    .card-middle { display: flex; align-items: center; gap: 10px; }
    .card-name { font-size: 18px; font-weight: bold; }
    .card-barcode { background: white; border: 1px solid #cbd5e0; padding: 2px; text-align: center; }
    .card-barcode svg { max-width: 100%; height: 40px; }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      body { background: white; padding: 0; }
      .container, .header-bar, .no-print { display: none !important; }
      #print-area { display: grid !important; position: absolute; top: 11mm; left: 14mm; width: 182mm; height: 275mm; grid-template-columns: 91mm 91mm; grid-template-rows: repeat(5, 55mm); }
      .print-slot { width: 91mm; height: 55mm; box-sizing: border-box; }
      .biz-card { width: 91mm !important; height: 55mm !important; margin: 0 !important; border: 0.5px solid #cbd5e0 !important; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>

<div class="container">

  <!-- 1. メインメニュー -->
  <div id="staff-menu" class="view-screen active">
    <div class="header-bar">
      <h1>🛠️ 職員専用 管理メニュー</h1>
      <a href="index.html" class="btn btn-blue" style="text-decoration:none;">📱 子ども受付画面へ</a>
    </div>
    <div class="menu-grid">
      <div class="menu-card" onclick="openScreen('staff-status'); loadActiveUsers();">
        <div class="menu-icon">👥</div>
        <div class="menu-info">
          <h3>現在の在室者一覧</h3>
          <p>リアルタイムで在室している子どもの確認を行います。</p>
        </div>
      </div>
      <div class="menu-card" onclick="openScreen('staff-register')">
        <div class="menu-icon">📝</div>
        <div class="menu-info">
          <h3>利用者マスター登録・管理</h3>
          <p>新規利用者の登録（緊急連絡先含む）、情報変更、カード個別印刷を行います。</p>
        </div>
      </div>
      <div class="menu-card" onclick="openScreen('staff-bulk')">
        <div class="menu-icon">🖨️</div>
        <div class="menu-info">
          <h3>利用者カード 一括作成・印刷</h3>
          <p>指定ID範囲のカードをA4（10面）シートにまとめて印刷します。</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 在室一覧 -->
  <div id="staff-status" class="view-screen">
    <div class="header-bar">
      <h1>👥 現在の在室者一覧 (<span id="active-count">0</span>人)</h1>
      <div>
        <button class="btn btn-blue" onclick="loadActiveUsers()">🔄 更新</button>
        <button class="btn btn-back" onclick="openScreen('staff-menu')">🏠 メニューへ</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>入館番号</th><th>おなまえ</th><th>利用目的</th><th>入室時刻</th></tr>
      </thead>
      <tbody id="user-table-body">
        <tr><td colspan="4">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 3. 利用者マスター登録・修正（緊急連絡先追加） -->
  <div id="staff-register" class="view-screen">
    <div class="header-bar">
      <h1>📝 利用者マスター登録・管理</h1>
      <button class="btn btn-back" onclick="openScreen('staff-menu')">🏠 メニューへ</button>
    </div>

    <!-- 検索バー -->
    <div style="display:flex; gap:10px; margin-bottom:15px; background:#edf2f7; padding:12px; border-radius:8px;">
      <input type="text" id="search-id" placeholder="登録済みID（6桁）で呼出" oninput="autoToHalfWidth(this)" style="padding:8px; flex:1; border:1px solid #cbd5e0; border-radius:4px;">
      <button class="btn btn-blue" onclick="searchUser()">🔍 検索・呼出</button>
    </div>

    <input type="hidden" id="user-id">

    <div class="section-title">👤 本人情報</div>
    <div class="form-row">
      <div class="form-group">
        <label>氏名（フルネーム） *</label>
        <input type="text" id="user-name" placeholder="山田 太郎">
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label style="margin:0;">生年月 *</label>
          <div class="bday-type-selector">
            <label><input type="radio" name="bday-type" value="wareki" checked onchange="toggleBdayMode()"> 和暦</label>
            <label><input type="radio" name="bday-type" value="seireki" onchange="toggleBdayMode()"> 西暦</label>
          </div>
        </div>

        <div id="wareki-box" class="wareki-container" style="margin-top:5px;">
          <select id="wareki-era" class="wareki-select" onchange="onWarekiChange()">
            <option value="令和" selected>令和</option>
            <option value="平成">平成</option>
            <option value="昭和">昭和</option>
          </select>
          <input type="text" id="wareki-year" class="wareki-input" inputmode="numeric" placeholder="年" maxlength="2" oninput="autoToHalfWidth(this); onWarekiChange();"> 年
          <input type="text" id="wareki-month" class="wareki-input" inputmode="numeric" placeholder="月" maxlength="2" oninput="autoToHalfWidth(this); onWarekiChange();"> 月
        </div>

        <div id="seireki-box" style="display:none; margin-top:5px;">
          <input type="month" id="seireki-input" style="width:100%;" onchange="onSeirekiChange()">
        </div>

        <div id="date-preview" class="date-preview">（西暦： 未入力）</div>
        <input type="hidden" id="user-birthday">
      </div>
    </div>

    <!-- ★ 緊急連絡先セクション（追加部分） -->
    <div class="section-title">🚨 緊急連絡先</div>
    <div class="form-row">
      <div class="form-group">
        <label>保護者氏名</label>
        <input type="text" id="guardian-name" placeholder="例: 山田 花子">
      </div>
      <div class="form-group">
        <label>続柄</label>
        <select id="relation">
          <option value="">選択してください</option>
          <option value="母">母</option>
          <option value="父">父</option>
          <option value="祖母">祖母</option>
          <option value="祖父">祖父</option>
          <option value="その他">その他</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>連絡先1（電話番号）</label>
        <input type="tel" id="tel-1" placeholder="例: 090-1234-5678" oninput="autoToHalfWidth(this)">
      </div>
      <div class="form-group">
        <label>連絡先2（勤務先・固定電話等）</label>
        <input type="tel" id="tel-2" placeholder="例: 0595-68-1234" oninput="autoToHalfWidth(this)">
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-clear" onclick="clearRegisterForm()">クリア</button>
      <button class="btn btn-green" style="flex:1; padding:12px;" onclick="saveUserData()">💾 登録 / 上書き保存</button>
    </div>

    <div id="reg-card-preview" style="margin-top:25px; display:none; border-top:1px dashed #cbd5e0; padding-top:15px;">
      <h3 style="text-align:center; color:#2b6cb0; margin:0 0 10px 0;">🪪 カード印刷プレビュー</h3>
      <div id="single-card-output"></div>
      <button class="btn btn-blue no-print" style="width:100%; max-width:340px; display:block; margin:10px auto;" onclick="printSingleCard()">🖨️ このカードを印刷</button>
    </div>
  </div>

  <!-- 4. カード一括印刷 -->
  <div id="staff-bulk" class="view-screen">
    <div class="header-bar">
      <h1>🖨️ 利用者カード 一括作成</h1>
      <button class="btn btn-back" onclick="openScreen('staff-menu')">🏠 メニューへ</button>
    </div>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:15px;">
      <input type="text" id="bulk-start" placeholder="開始ID (例:260001)" oninput="autoToHalfWidth(this)" style="padding:8px;">
      <span>〜</span>
      <input type="text" id="bulk-end" placeholder="終了ID (例:260010)" oninput="autoToHalfWidth(this)" style="padding:8px;">
      <button class="btn btn-blue" onclick="generateBulk()">生成</button>
    </div>
    <button id="bulk-print-btn" class="btn btn-green no-print" style="width:100%; display:none; margin-bottom:15px;" onclick="window.print()">🖨️ まとめて印刷（A4 10面）</button>
    <div id="bulk-card-output" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
  </div>

</div>

<!-- 印刷用グリッド枠 -->
<div id="print-area" style="display:none;"></div>

<script>
  // ★★★ あなたのGASのWebアプリURLをここに貼り付けてください ★★★
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw.../exec";
  let currentRegisteredUser = null;

  function openScreen(id) {
    document.querySelectorAll('.view-screen').forEach(el => el.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function autoToHalfWidth(elem) {
    if (!elem.value) return;
    elem.value = elem.value
      .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .replace(/[Ａ-Ｚａ-ｚ]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
      .replace(/ー/g, '-');
  }

  /* === 和暦・西暦変換 === */
  function toggleBdayMode() {
    const isWareki = document.querySelector('input[name="bday-type"]:checked').value === 'wareki';
    document.getElementById("wareki-box").style.display = isWareki ? "flex" : "none";
    document.getElementById("seireki-box").style.display = isWareki ? "none" : "block";
    updateDateDisplay();
  }

  function onWarekiChange() {
    const era = document.getElementById("wareki-era").value;
    const y = parseInt(document.getElementById("wareki-year").value, 10);
    const m = parseInt(document.getElementById("wareki-month").value, 10);
    if (!y || !m) {
      document.getElementById("user-birthday").value = "";
      document.getElementById("seireki-input").value = "";
      updateDateDisplay();
      return;
    }
    let base = era === "令和" ? 2018 : (era === "平成" ? 1988 : 1925);
    const fullYear = base + y;
    const mm = String(m).padStart(2, "0");
    document.getElementById("user-birthday").value = `${fullYear}/${mm}`;
    document.getElementById("seireki-input").value = `${fullYear}-${mm}`;
    updateDateDisplay();
  }

  function onSeirekiChange() {
    const val = document.getElementById("seireki-input").value;
    if (!val) {
      document.getElementById("user-birthday").value = "";
      document.getElementById("wareki-year").value = "";
      document.getElementById("wareki-month").value = "";
      updateDateDisplay();
      return;
    }
    const [y, m] = val.split("-").map(Number);
    document.getElementById("user-birthday").value = `${y}/${String(m).padStart(2,"0")}`;
    let era = "令和", wYear = y - 2018;
    if (y * 100 + m < 201905) { era = "平成"; wYear = y - 1988; }
    if (y * 100 + m < 198901) { era = "昭和"; wYear = y - 1925; }
    document.getElementById("wareki-era").value = era;
    document.getElementById("wareki-year").value = wYear;
    document.getElementById("wareki-month").value = m;
    updateDateDisplay();
  }

  function updateDateDisplay() {
    const bday = document.getElementById("user-birthday").value;
    const preview = document.getElementById("date-preview");
    const isWareki = document.querySelector('input[name="bday-type"]:checked').value === 'wareki';
    if (!bday) {
      preview.innerText = isWareki ? "（西暦： 未入力）" : "（和暦： 未入力）";
      return;
    }
    preview.innerText = isWareki ? `（西暦： ${bday}）` : `（和暦： ${document.getElementById("wareki-era").value}${document.getElementById("wareki-year").value}年${document.getElementById("wareki-month").value}月）`;
  }

  function setBirthdayValue(dateStr) {
    if (!dateStr) return;
    const ymMatch = String(dateStr).replace(/\//g, "-").match(/^(\d{4}-\d{2})/);
    if (ymMatch) {
      document.getElementById("seireki-input").value = ymMatch[1];
      onSeirekiChange();
    }
  }

  /* === 利用者検索・保存（緊急連絡先対応） === */
  function searchUser() {
    const id = document.getElementById("search-id").value.trim();
    if (!id) return alert("検索するIDを入力してください");

    fetch(`${GAS_API_URL}?action=getUserById&userId=${id}`)
      .then(res => res.json())
      .then(u => {
        if (!u) return alert("該当する利用者は見つかりませんでした");
        currentRegisteredUser = u;
        document.getElementById("user-id").value = u.userId;
        document.getElementById("user-name").value = u.name;
        document.getElementById("guardian-name").value = u.guardianName || "";
        document.getElementById("relation").value = u.relation || "";
        document.getElementById("tel-1").value = u.tel1 || "";
        document.getElementById("tel-2").value = u.tel2 || "";
        setBirthdayValue(u.birthday || "");
        renderSinglePreview(u);
      });
  }

  function saveUserData() {
    const name = document.getElementById("user-name").value.trim();
    const bday = document.getElementById("user-birthday").value;
    const id = document.getElementById("user-id").value;
    const guardianName = document.getElementById("guardian-name").value.trim();
    const relation = document.getElementById("relation").value;
    const tel1 = document.getElementById("tel-1").value.trim();
    const tel2 = document.getElementById("tel-2").value.trim();

    if (!name || !bday) return alert("氏名と生年月は必須項目です");

    const payload = {
      userId: id || null,
      name: name,
      birthday: bday,
      guardianName: guardianName,
      relation: relation,
      tel1: tel1,
      tel2: tel2
    };

    fetch(`${GAS_API_URL}?action=saveUser&userData=${encodeURIComponent(JSON.stringify(payload))}`)
      .then(res => res.json())
      .then(u => {
        alert("登録・保存が完了しました！\n利用者ID: " + u.userId);
        currentRegisteredUser = u;
        document.getElementById("user-id").value = u.userId;
        document.getElementById("search-id").value = u.userId;
        renderSinglePreview(u);
      })
      .catch(err => alert("保存エラー: " + err.message));
  }

  function clearRegisterForm() {
    currentRegisteredUser = null;
    document.getElementById("user-id").value = "";
    document.getElementById("search-id").value = "";
    document.getElementById("user-name").value = "";
    document.getElementById("guardian-name").value = "";
    document.getElementById("relation").value = "";
    document.getElementById("tel-1").value = "";
    document.getElementById("tel-2").value = "";
    document.getElementById("seireki-input").value = "";
    document.getElementById("user-birthday").value = "";
    document.getElementById("wareki-year").value = "";
    document.getElementById("wareki-month").value = "";
    updateDateDisplay();
    document.getElementById("reg-card-preview").style.display = "none";
  }

  /* === カードプレビュー・印刷 === */
  function renderSinglePreview(u) {
    document.getElementById("reg-card-preview").style.display = "block";
    const out = document.getElementById("single-card-output");
    out.innerHTML = buildCard(u, "single-barcode");
    drawBarcode("single-barcode", u.userId);
  }

  function printSingleCard() {
    const printArea = document.getElementById("print-area");
    printArea.innerHTML = `<div class="print-slot">${buildCard(currentRegisteredUser, "print-single-bc")}</div>`;
    drawBarcode("print-single-bc", currentRegisteredUser.userId);
    window.print();
  }

  function buildCard(u, svgId) {
    return `
      <div class="biz-card">
        <div class="card-header"><div>🌱 遊ゆうスペース</div><div>利用者カード</div></div>
        <div class="card-middle">
          <div><div class="card-name">${u.name} 様</div><div style="font-size:11px; color:#2b6cb0;">ID: ${u.userId}</div></div>
        </div>
        <div class="card-barcode"><svg id="${svgId}"></svg></div>
        <div style="font-size:8px; color:#718096; display:flex; justify-content:space-between;">
          <span>つつじが丘市民センター</span><span>※入退室時に提示</span>
        </div>
      </div>
    `;
  }

  function drawBarcode(id, val) {
    setTimeout(() => {
      try {
        JsBarcode("#" + id, String(val), { format: "CODE128", width: 1.6, height: 35, displayValue: true, fontSize: 11 });
      } catch(e){}
    }, 50);
  }

  /* === 在室一覧・一括生成 === */
  function loadActiveUsers() {
    const tbody = document.getElementById("user-table-body");
    tbody.innerHTML = "<tr><td colspan='4'>読み込み中...</td></tr>";
    fetch(`${GAS_API_URL}?action=getActiveUsers`)
      .then(res => res.json())
      .then(users => {
        tbody.innerHTML = "";
        document.getElementById("active-count").innerText = users.length;
        if (users.length === 0) {
          tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>現在入室中の子どもはいません。</td></tr>";
          return;
        }
        users.forEach(u => {
          let tr = document.createElement("tr");
          tr.innerHTML = `<td><b>${u.permitNumber}番</b></td><td>${u.name}</td><td>${u.purpose}</td><td>${u.entryTime}</td>`;
          tbody.appendChild(tr);
        });
      });
  }

  function generateBulk() {
    const s = document.getElementById("bulk-start").value.trim();
    const e = document.getElementById("bulk-end").value.trim();
    if (!s || !e) return alert("開始・終了IDを入れてください");

    fetch(`${GAS_API_URL}?action=getUsersByIdRange&startId=${s}&endId=${e}`)
      .then(res => res.json())
      .then(users => {
        const out = document.getElementById("bulk-card-output");
        const printArea = document.getElementById("print-area");
        out.innerHTML = "";
        printArea.innerHTML = "";
        if (!users || users.length === 0) return alert("対象データがありません");

        users.forEach((u, i) => {
          out.innerHTML += buildCard(u, "bulk-bc-" + i);
          printArea.innerHTML += `<div class="print-slot">${buildCard(u, "pbulk-bc-" + i)}</div>`;
        });
        users.forEach((u, i) => {
          drawBarcode("bulk-bc-" + i, u.userId);
          drawBarcode("pbulk-bc-" + i, u.userId);
        });
        document.getElementById("bulk-print-btn").style.display = "block";
      });
  }
</script>
</body>
</html>
