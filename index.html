<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- タブレットの画面サイズにぴったり合わせ、勝手なズームを防ぐ設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>遊ゆうスペース 入退室管理</title>
  <style>
    /* 画面の余白を完全になくし、スクロールバーを非表示にする */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    /* GASの画面をタブレットの画面いっぱいに広げる */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- ★最重要：下の「https://google.com〜」の部分を、あなたのGASの【ウェブアプリURL】に書き換えてください -->
  <iframe src="https://script.google.com/macros/s/AKfycbyMrr61Ru5R67qcPi_cbIZevqX_80FCxmtWLKV8oeTlTQ0cMktmg_bZ34ULgzQ2uSaKfQ/exec"></iframe>

</body>
</html>
